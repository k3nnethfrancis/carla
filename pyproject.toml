[project]
name = "character-lab"
version = "0.2.0"
description = "A local terminal Loom for developing character seed documents"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "huggingface-hub>=1,<3",
    "psutil>=7,<8",
]

[project.scripts]
carla = "character_lab.cli:main"
character-lab = "character_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff==0.16.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
